name: Build Optijetor

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build x64 Release
        run: msbuild Optijetor.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item artifacts/Release/version.dll package/
          Copy-Item OpenNR.ini package/
          Copy-Item README.md package/
      - uses: actions/upload-artifact@v4
        with:
          name: Optijetor-x64
          path: package/
