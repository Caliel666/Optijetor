[OpenNR]
; Absolute path to the separate OptiScaler DLL
OptiScalerPath=C:\OptiScaler\OptiScaler.dll

; Delay before loading OptiScaler (0-30000 ms)
LoadDelayMs=1500

; Bridge game-root DLLs and OptiScaler companion DLLs into a temporary runtime folder (0 or 1)
BridgeGameDlls=1

; Write OpenNR.log beside version.dll (0 or 1)
Logging=1
