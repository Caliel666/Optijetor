[OpenNR]
; Absolute path to your separate OptiScaler DLL, renamed to version.dll
OptiScalerPath=C:\OptiScaler\version.dll

; Delay before loading OptiScaler (0-30000 ms); 5000 gives the game more time to start
LoadDelayMs=5000

; Write OpenNR.log beside the game's version.dll proxy (0 or 1)
Logging=1
